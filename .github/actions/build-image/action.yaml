name: Build Harbor Mail image
description: Build and verify both Linux architectures on GHCR
inputs:
  version:
    description: Harbor Mail build version
    required: true
  token:
    description: Token with GHCR package write access
    required: true
outputs:
  digest:
    description: Verified OCI image index digest
    value: ${{ steps.image.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64
    - uses: docker/setup-buildx-action@v4
    - name: Build and verify the GHCR image
      id: image
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GHCR_TOKEN: ${{ inputs.token }}
      run: |
        set -Eeuo pipefail
        printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        registry=ghcr.io/makessr/harbormail
        image="$registry:sha-${GITHUB_SHA::7}"
        if [[ $VERSION == dev ]]; then image="$registry:dev-sha-${GITHUB_SHA::7}"; fi
        docker buildx build --platform linux/amd64,linux/arm64 --push \
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
          --label "org.opencontainers.image.revision=$GITHUB_SHA" \
          --label "org.opencontainers.image.version=$VERSION" \
          --label "org.opencontainers.image.licenses=Apache-2.0" \
          --build-arg "HARBOR_BUILD_VERSION=$VERSION" --tag "$image" .
        digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
        [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
        for arch in amd64 arm64; do
          test "$(docker run --rm --platform "linux/$arch" --network none "$registry@$digest" version)" = "$VERSION"
          docker run --rm --platform "linux/$arch" --network none --entrypoint /bin/sh "$registry@$digest" -ec '
            cd /usr/share/licenses/harbormail
            test -s LICENSE && test -s THIRD_PARTY_NOTICES.md && test -s docs/licenses/go-runtime.txt && test -s docs/licenses/alpine-runtime.tsv
          '
          printf '%s\n' 'image-smoke-test' | docker run --rm -i --platform "linux/$arch" --network none "$registry@$digest" hash-password
        done
        printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
    - name: Scan both Linux images before promotion
      shell: bash
      env:
        IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
      run: |
        set -euo pipefail
        scanner=ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        target="ghcr.io/makessr/harbormail@$IMAGE_DIGEST"
        mkdir -p "$RUNNER_TEMP/harbor-image-scan"
        for arch in amd64 arm64; do
          docker run --rm -v "$RUNNER_TEMP/harbor-image-scan:/reports" "$scanner" image \
            --cache-dir /reports/cache --image-src remote --platform "linux/$arch" \
            --scanners vuln --severity HIGH,CRITICAL --format json --output "/reports/$arch.json" "$target"
        done
        for arch in amd64 arm64; do
          report="$RUNNER_TEMP/harbor-image-scan/$arch.json"
          jq -r '.Results[]?.Vulnerabilities[]? | [.Severity,.VulnerabilityID,.PkgName,.InstalledVersion,(.FixedVersion // "")] | @tsv' "$report"
          if jq -e 'any(.Results[]?.Vulnerabilities[]?; (.FixedVersion // "") != "")' "$report" >/dev/null; then
            echo "Fixable high or critical vulnerabilities in linux/$arch" >&2
            exit 1
          fi
        done
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: harbor-image-vulnerability-reports
        path: ${{ runner.temp }}/harbor-image-scan/*.json
        if-no-files-found: ignore
