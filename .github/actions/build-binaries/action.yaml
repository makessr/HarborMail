name: Build Harbor Mail binaries
description: Build the Linux and Windows binaries with SHA-256 checksums
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - name: Build binaries and checksums
      shell: bash
      env:
        CGO_ENABLED: '0'
      run: |
        set -euo pipefail
        sha256sum -c docs/licenses/go-inputs.sha256
        mkdir -p dist
        version=$(bash .github/scripts/release-version.sh)
        if [[ ${GITHUB_REF_TYPE:-} == tag ]]; then
          version=$GITHUB_REF_NAME
          [[ $version =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
        fi
        flags="-s -w -X harbormail/internal/server.buildVersion=${version:-dev}"
        GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$flags" -o dist/harbormail-linux-amd64 ./cmd/harbormail
        GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$flags" -o dist/harbormail-linux-arm64 ./cmd/harbormail
        GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$flags" -o dist/harbormail-windows-amd64.exe ./cmd/harbormail
        GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="$flags" -o dist/harbormail-windows-arm64.exe ./cmd/harbormail
        test "$(dist/harbormail-linux-amd64 version)" = "${version:-dev}"
        tar -czf dist/harbormail-systemd.tar.gz ops/harbormail.service ops/harbormail.env.example \
          ops/backup.sh ops/harbor-backup.service ops/harbor-backup.timer ops/harbor-backup.env.example \
          ops/compose-maintenance.sh ops/install-compose-maintenance.sh \
          ops/harbor-compose-maintenance@.service \
          ops/harbor-compose-check.timer ops/harbor-compose-backup.timer
        cp docs/licenses/go-qrcode.txt dist/go-qrcode-LICENSE.txt
        cp docs/licenses/go-msgauth.txt dist/go-msgauth-LICENSE.txt
        cp docs/licenses/webpush-go.txt dist/webpush-go-LICENSE.txt
        cp docs/licenses/jwt-v5.txt dist/jwt-v5-LICENSE.txt
        tar -czf dist/harbormail-licenses.tar.gz LICENSE NOTICE THIRD_PARTY_NOTICES.md \
          docs/licenses web/Remix-Icon-License.txt web/Kubai-Icons-License.txt \
          web/fonts/source-han-OFL.txt web/notosanssc-v41/OFL.txt
        cd dist
        sha256sum -- harbormail-linux-amd64 harbormail-linux-arm64 harbormail-windows-amd64.exe harbormail-windows-arm64.exe harbormail-systemd.tar.gz \
          go-qrcode-LICENSE.txt go-msgauth-LICENSE.txt webpush-go-LICENSE.txt jwt-v5-LICENSE.txt \
          harbormail-licenses.tar.gz > SHA256SUMS
