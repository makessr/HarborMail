name: Verify Harbor Mail

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concurrency-and-parsing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run race detector
        run: go test -race ./... -count=1
      - name: Test independent SMTP, IMAP and POP3 clients
        run: |
          go build -o "$RUNNER_TEMP/harbormail" ./cmd/harbormail
          python3 .github/scripts/test-mail-clients.py "$RUNNER_TEMP/harbormail"
      - name: Fuzz mail parsers
        run: |
          go test ./internal/mailmime -run '^$' -fuzz '^FuzzInspectHTML$' -fuzztime=15s -parallel=2
          go test ./internal/server -run '^$' -fuzz '^FuzzPOP3Top$' -fuzztime=15s -parallel=2
          go test ./internal/server -run '^$' -fuzz '^FuzzEMLImport$' -fuzztime=15s -parallel=2

  go-vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install the scanner for the runner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - name: Check reachable Go vulnerabilities
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: "$(go env GOPATH)/bin/govulncheck ./..."

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test ACME issuance and renewal
        shell: bash
        run: |
          set -Eeuo pipefail
          fixture="$RUNNER_TEMP/harbor-pebble"
          mkdir -p "$fixture"
          archive="$fixture/pebble-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 45 \
            https://github.com/letsencrypt/pebble/releases/download/v2.10.3/pebble-linux-amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 7e33cf3e426b67e9e647c44e8cc91683caa8ab331f7a99e5e27fcee291c4c7e2 "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$fixture" --strip-components=3 pebble-linux-amd64/linux/amd64/pebble
          chmod 0755 "$fixture/pebble"
          HARBOR_TEST_PEBBLE="$fixture/pebble" go test ./internal/server -run '^Test(ACMECertificateLifecycle|CloudflareDNS01)$' -count=1 -timeout=2m -v
      - name: Test SQLite and MySQL
        shell: bash
        run: |
          set -Eeuo pipefail
          export MYSQL_ROOT_PASSWORD MYSQL_PASSWORD
          MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)
          MYSQL_PASSWORD=$(openssl rand -hex 24)
          printf '::add-mask::%s\n' "$MYSQL_ROOT_PASSWORD" "$MYSQL_PASSWORD"
          database=$(docker run -d --tmpfs /var/lib/mysql -p 127.0.0.1::3306 \
            -e MYSQL_ROOT_PASSWORD -e MYSQL_PASSWORD -e MYSQL_USER=harbor -e MYSQL_DATABASE=harbor_test \
            mysql:8.4 --log-bin-trust-function-creators=1)
          redis=
          trap 'docker rm -fv "$database" ${redis:+"$redis"} >/dev/null' EXIT
          ready=false
          for attempt in {1..90}; do
            if docker exec "$database" mysqladmin ping -h 127.0.0.1 --silent >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ $ready != true ]]; then
            printf 'Isolated MySQL did not start\n' >&2
            exit 1
          fi
          address=$(docker port "$database" 3306/tcp)
          HARBOR_TEST_MYSQL_DSN="harbor:$MYSQL_PASSWORD@tcp($address)/harbor_test" go test ./... -count=1 -coverprofile="$RUNNER_TEMP/critical.cover"
          {
            printf '### 认证、授权、投递和迁移的函数覆盖率\n\n```text\n'
            go tool cover -func="$RUNNER_TEMP/critical.cover" |
              awk '/\/(account_access|account_password|app_passwords|admin_roles|admin_mfa|mailbox_mfa|web_login_guard|mysql_login_limiter|protocol_login_guard|protocol_sessions|web_sessions|outbox|recipient_delivery|migration)\.go:/ {print}'
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          go vet ./...
          redis=$(docker run -d -p 127.0.0.1::6379 redis:8.10.3-alpine)
          redis_address=$(docker port "$redis" 6379/tcp)
          packages=()
          command -v restic >/dev/null || packages+=(restic)
          command -v sqlite3 >/dev/null || packages+=(sqlite3)
          command -v mysqldump >/dev/null || packages+=(mysql-client)
          command -v htpasswd >/dev/null || packages+=(apache2-utils)
          if (( ${#packages[@]} != 0 )); then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          backup_password=$(openssl rand -hex 24)
          printf '::add-mask::%s\n' "$backup_password"
          docker exec -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" "$database" mysql --user=root -e \
            "CREATE USER 'harbor_backup'@'%' IDENTIFIED BY '$backup_password';
            GRANT SELECT, SHOW VIEW ON harbor_test.* TO 'harbor_backup'@'%';
            CREATE DATABASE harbor_verify_backup;"
          HARBOR_TEST_MYSQL_DSN="harbor:$MYSQL_PASSWORD@tcp($address)/harbor_test" \
            HARBOR_TEST_REDIS_URL="redis://$redis_address/0" \
            HARBOR_TEST_BACKUP_MYSQL_PORT="${address##*:}" HARBOR_TEST_BACKUP_MYSQL_PASSWORD="$backup_password" \
            HARBOR_TEST_BACKUP_MYSQL_CONTAINER="$database" bash .github/scripts/test-systemd.sh
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify compiled UI styles
        run: |
          npm ci --no-audit --no-fund
          npm run build:ui
          git diff --exit-code -- web/harbor-ui.css
      - name: Test Webmail in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:web
      - name: Check Web and operations files
        shell: bash
        run: |
          set -Eeuo pipefail
          find web -name '*.js' -print0 | xargs -0 -n 1 node --check
          bash -n ops/backup.sh
          bash -n ops/init-docker.sh
          export HARBOR_DATA_PATH=/tmp/harbor-data HARBOR_MYSQL_DATA_PATH=/tmp/harbor-mysql
          export HARBOR_ACME_HOSTS=mail.harbor.test
          for edition in minimal standard full; do
            docker compose -f "compose.$edition.yaml" config --quiet
          done
          docker compose -f compose.yaml -f compose.ops.yaml config --quiet
          docker compose -f compose.yaml -f compose.mysql.yaml -f compose.registry.yaml \
            -f compose.ops.yaml -f compose.mysql.ops.yaml config --quiet
          docker compose -f compose.yaml -f compose.mysql.yaml -f compose.acme.yaml config --quiet
          docker compose -f compose.yaml -f compose.mysql.yaml -f compose.registry.yaml -f compose.acme-cloudflare.yaml config --format json |
            jq -e '.services.harbor |
              .environment.HARBOR_ACME_CHALLENGE == "cloudflare" and
              (.environment | has("HARBOR_ACME_HTTP") | not) and
              ([.ports[].target] | index(8081) | not)'
          docker compose -f compose.yaml -f compose.mysql.yaml -f compose.registry.yaml \
            -f compose.relay-auth.yaml -f compose.domain-relays.yaml -f compose.relay-ca.yaml config --quiet
          docker compose -f compose.yaml -f compose.mysql.yaml -f compose.registry.yaml -f compose.dkim.yaml config --quiet
          docker run --rm --network none --volume "$PWD:/src:ro" --workdir /src \
            --entrypoint /bin/promtool prom/prometheus:v3.5.0 test rules ops/prometheus-rules.test.yaml
          docker run --rm --network none --volume "$PWD:/src:ro" --workdir /src \
            --entrypoint /bin/promtool prom/prometheus:v3.5.0 check config \
            ops/prometheus.example.yaml ops/prometheus-mail-probes.example.yaml
          docker run --rm --network none --volume "$PWD/ops:/etc/blackbox_exporter:ro" \
            prom/blackbox-exporter:v0.29.1 --config.file=/etc/blackbox_exporter/blackbox.yaml --config.check
