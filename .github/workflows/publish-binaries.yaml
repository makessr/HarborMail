name: Publish Harbor Mail binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/verify.yaml
    permissions:
      contents: read
  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-binaries
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a release tag in vMAJOR.MINOR.PATCH format\n' >&2
            exit 1
          fi
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [[ -s "$notes" ]]; then
            release_notes=(--notes-file "$notes")
          else
            release_notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Harbor Mail $GITHUB_REF_NAME" "${release_notes[@]}" \
            dist/harbormail-linux-amd64 dist/harbormail-linux-arm64 dist/harbormail-windows-amd64.exe \
            dist/harbormail-systemd.tar.gz dist/go-qrcode-LICENSE.txt dist/go-msgauth-LICENSE.txt \
            dist/webpush-go-LICENSE.txt dist/jwt-v5-LICENSE.txt dist/SHA256SUMS
