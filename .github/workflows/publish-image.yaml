name: Publish Harbor Mail image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/verify.yaml
    permissions:
      contents: read
  binaries:
    needs: checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/build-binaries
      - uses: actions/upload-artifact@v7
        with:
          name: harbormail-binaries-${{ github.sha }}
          path: |
            dist/harbormail-linux-amd64
            dist/harbormail-linux-arm64
            dist/harbormail-windows-amd64.exe
            dist/harbormail-windows-arm64.exe
            dist/harbormail-systemd.tar.gz
            dist/go-qrcode-LICENSE.txt
            dist/go-msgauth-LICENSE.txt
            dist/webpush-go-LICENSE.txt
            dist/jwt-v5-LICENSE.txt
            dist/SHA256SUMS
          if-no-files-found: error
  publish:
    needs: checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine the build version
        id: version
        run: |
          set -euo pipefail
          version=$(bash .github/scripts/release-version.sh)
          printf 'version=%s\n' "${version:-dev}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-image
        with:
          version: ${{ steps.version.outputs.version }}
          token: ${{ github.token }}
