name: Publish Harbor Mail image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/verify.yaml
    permissions:
      contents: read
  binaries:
    needs: checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-binaries
      - uses: actions/upload-artifact@v7
        with:
          name: harbormail-binaries-${{ github.sha }}
          path: |
            dist/harbormail-linux-amd64
            dist/harbormail-linux-arm64
            dist/harbormail-windows-amd64.exe
            dist/harbormail-systemd.tar.gz
            dist/go-qrcode-LICENSE.txt
            dist/go-msgauth-LICENSE.txt
            dist/SHA256SUMS
          if-no-files-found: error
  publish:
    needs: checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build and verify both architectures before promoting latest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          registry=ghcr.io/makessr/harbormail
          image="$registry:sha-${GITHUB_SHA::7}"
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" .
          for arch in amd64 arm64; do
            printf '%s\n' 'image-smoke-test' | docker run --rm -i --platform "linux/$arch" --network none "$image" hash-password
          done
          docker buildx imagetools create --tag "$registry:latest" "$image"
