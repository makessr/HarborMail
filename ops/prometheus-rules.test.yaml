rule_files:
  - prometheus-rules.yaml

evaluation_interval: 1m

tests:
  - name: Queue depth and abnormal disk mounts
    input_series:
      - series: 'harbor_outbox_ready_messages{job="harbor-mail",instance="queue"}'
        values: '250+0x11'
      - series: 'node_filesystem_readonly{job="harbor-node",mountpoint="/srv/harbor-data"}'
        values: '1+0x11'
      - series: 'node_filesystem_files{job="harbor-node",mountpoint="/srv/harbor-data"}'
        values: '100+0x11'
      - series: 'node_filesystem_files_free{job="harbor-node",mountpoint="/srv/harbor-data"}'
        values: '5+0x11'
    alert_rule_test:
      - eval_time: 5m
        alertname: HarborOutboxBacklogHigh
        exp_alerts:
          - exp_labels: {job: harbor-mail, instance: queue, severity: warning}
            exp_annotations: {summary: Harbor Mail 有超过 200 封已到期邮件等待投递}
      - eval_time: 2m
        alertname: HarborVolumeReadOnly
        exp_alerts:
          - exp_labels: {job: harbor-node, mountpoint: /srv/harbor-data, severity: critical}
            exp_annotations: {summary: Harbor Mail 存储挂载已变为只读}
      - eval_time: 10m
        alertname: HarborVolumeInodesLow
        exp_alerts:
          - exp_labels: {job: harbor-node, mountpoint: /srv/harbor-data, severity: warning}
            exp_annotations: {summary: Harbor Mail 存储可用 inode 低于 10%}
  - name: DKIM alerts only for a Harbor Mail instance with unusable signing keys
    interval: 1m
    input_series:
      - series: 'harbor_dkim_unusable_domains{job="harbor-mail",instance="wrong-secret"}'
        values: '0 1 1 1 0 0'
      - series: 'harbor_dkim_unusable_domains{job="harbor-mail",instance="healthy"}'
        values: '0+0x5'
      - series: 'harbor_dkim_unusable_domains{job="other",instance="foreign"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: HarborDKIMKeysUnusable
      - eval_time: 3m
        alertname: HarborDKIMKeysUnusable
        exp_alerts:
          - exp_labels: {job: harbor-mail, instance: wrong-secret, severity: critical}
            exp_annotations: {summary: Harbor Mail 有已启用的 DKIM 私钥在此实例不可用，运行 dkim-check 排查}
      - eval_time: 4m
        alertname: HarborDKIMKeysUnusable
  - name: Queue growth, overdue mail and application scrape failure
    interval: 1m
    input_series:
      - series: 'up{job="harbor-mail"}'
        values: '1 0+0x2 1+0x8'
      - series: 'harbor_outbox_oldest_due_seconds{job="harbor-mail"}'
        values: '0 301+0x5 0+0x5'
      - series: 'harbor_outbox_uncertain_messages{job="harbor-mail"}'
        values: '0 0 1+0x4 0+0x4'
      - series: 'harbor_spam_training_failed_samples{job="harbor-mail"}'
        values: '0 0 1+0x4 0+0x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: HarborMetricsUnavailable
      - eval_time: 3m
        alertname: HarborMetricsUnavailable
        exp_alerts:
          - exp_labels: {job: harbor-mail, severity: critical}
            exp_annotations: {summary: Harbor Mail 指标抓取失败，检查进程、数据库和抓取网络}
      - eval_time: 4m
        alertname: HarborMetricsUnavailable
      - eval_time: 5m
        alertname: HarborOutboxOverdue
      - eval_time: 6m
        alertname: HarborOutboxOverdue
        exp_alerts:
          - exp_labels: {job: harbor-mail, severity: warning}
            exp_annotations: {summary: 有已到期的邮件等待投递超过五分钟}
      - eval_time: 7m
        alertname: HarborOutboxOverdue
      - eval_time: 2m
        alertname: HarborUncertainDeliveryIncreased
        exp_alerts:
          - exp_labels: {job: harbor-mail, severity: warning}
            exp_annotations: {summary: 新增投递结果未知的记录，重发前先核对中继}
      - eval_time: 7m
        alertname: HarborUncertainDeliveryIncreased
      - eval_time: 2m
        alertname: HarborSpamTrainingFailureIncreased
        exp_alerts:
          - exp_labels: {job: harbor-mail, severity: warning}
            exp_annotations: {summary: 新增垃圾邮件训练失败，检查 Rspamd 控制器}
      - eval_time: 7m
        alertname: HarborSpamTrainingFailureIncreased
  - name: A paused worker does not page for overdue mail, another worker still can
    interval: 1m
    input_series:
      - series: 'harbor_outbox_oldest_due_seconds{job="harbor-mail",instance="active"}'
        values: '600+0x12'
      - series: 'harbor_outbox_oldest_due_seconds{job="harbor-mail",instance="paused"}'
        values: '600+0x12'
      - series: 'harbor_outbox_paused{job="harbor-mail",instance="active"}'
        values: '0+0x12'
      - series: 'harbor_outbox_paused{job="harbor-mail",instance="paused"}'
        values: '1+0x6 0+0x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: HarborOutboxOverdue
        exp_alerts:
          - exp_labels: {job: harbor-mail, instance: active, severity: warning}
            exp_annotations: {summary: 有已到期的邮件等待投递超过五分钟}
      - eval_time: 12m
        alertname: HarborOutboxOverdue
        exp_alerts:
          - exp_labels: {job: harbor-mail, instance: active, severity: warning}
            exp_annotations: {summary: 有已到期的邮件等待投递超过五分钟}
          - exp_labels: {job: harbor-mail, instance: paused, severity: warning}
            exp_annotations: {summary: 有已到期的邮件等待投递超过五分钟}
  - name: Disk, expired backup, missing backup and host scrape failure
    interval: 1m
    input_series:
      - series: 'up{job="harbor-node",instance="disk"}'
        values: '1+0x11'
      - series: 'up{job="harbor-node",instance="no-backup"}'
        values: '1+0x11'
      - series: 'up{job="harbor-node",instance="down"}'
        values: '0+0x2 1+0x8'
      - series: 'node_filesystem_avail_bytes{job="harbor-node",instance="disk",mountpoint="/srv/harbor-mysql"}'
        values: '19+0x10 20'
      - series: 'node_filesystem_size_bytes{job="harbor-node",instance="disk",mountpoint="/srv/harbor-mysql"}'
        values: '100+0x11'
      - series: 'harbor_backup_last_success_timestamp_seconds{job="harbor-node",instance="disk"}'
        values: '-93601+0x10 660'
      - series: 'harbor_backup_last_success_timestamp_seconds{job="harbor-node",instance="no-backup"}'
        values: '_x11 660'
      - series: 'harbor_backup_last_success_timestamp_seconds{job="harbor-node",instance="down"}'
        values: '_x3 180+0x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: HarborNodeMetricsUnavailable
        exp_alerts:
          - exp_labels: {job: harbor-node, instance: down, severity: critical}
            exp_annotations: {summary: Harbor Mail 主机的磁盘及备份指标不可用}
      - eval_time: 3m
        alertname: HarborNodeMetricsUnavailable
      - eval_time: 9m
        alertname: HarborVolumeFreeLow
      - eval_time: 10m
        alertname: HarborVolumeFreeLow
        exp_alerts:
          - exp_labels: {job: harbor-node, instance: disk, mountpoint: /srv/harbor-mysql, severity: warning}
            exp_annotations: {summary: Harbor Mail 存储可用空间低于 20%}
      - eval_time: 11m
        alertname: HarborVolumeFreeLow
      - eval_time: 9m
        alertname: HarborDailyBackupStale
      - eval_time: 10m
        alertname: HarborDailyBackupStale
        exp_alerts:
          - exp_labels: {job: harbor-node, instance: disk, severity: critical}
            exp_annotations: {summary: Harbor Mail 最近 26 小时没有已记录的成功备份}
          - exp_labels: {job: harbor-node, instance: no-backup, severity: critical}
            exp_annotations: {summary: Harbor Mail 最近 26 小时没有已记录的成功备份}
      - eval_time: 11m
        alertname: HarborDailyBackupStale
  - name: Public probe failure, scrape failure and certificate renewal
    interval: 1m
    input_series:
      - series: 'up{job="harbor-public",instance="smtp"}'
        values: '1+0x12'
      - series: 'probe_success{job="harbor-public",instance="smtp"}'
        values: '0+0x3 1+0x8'
      - series: 'up{job="harbor-public",instance="exporter"}'
        values: '0+0x3 1+0x8'
      - series: 'probe_success{job="harbor-public",instance="exporter"}'
        values: '0+0x3 1+0x8'
      - series: 'up{job="harbor-public",instance="tls"}'
        values: '1+0x12'
      - series: 'probe_success{job="harbor-public",instance="tls"}'
        values: '1+0x12'
      - series: 'probe_ssl_earliest_cert_expiry{job="harbor-public",instance="tls"}'
        values: '1728000+0x10 7776000+0x1'
    alert_rule_test:
      - eval_time: 2m
        alertname: HarborPublicProbeScrapeFailed
      - eval_time: 2m
        alertname: HarborPublicEndpointUnavailable
      - eval_time: 3m
        alertname: HarborPublicProbeScrapeFailed
        exp_alerts:
          - exp_labels: {job: harbor-public, instance: exporter, severity: critical}
            exp_annotations: {summary: 无法抓取 Harbor Mail 公网探测结果}
      - eval_time: 3m
        alertname: HarborPublicEndpointUnavailable
        exp_alerts:
          - exp_labels: {job: harbor-public, instance: smtp, severity: critical}
            exp_annotations: {summary: Harbor Mail 公网端口或协议检查失败}
      - eval_time: 4m
        alertname: HarborPublicProbeScrapeFailed
      - eval_time: 4m
        alertname: HarborPublicEndpointUnavailable
      - eval_time: 9m
        alertname: HarborPublicCertificateExpiring
      - eval_time: 10m
        alertname: HarborPublicCertificateExpiring
        exp_alerts:
          - exp_labels: {job: harbor-public, instance: tls, severity: warning}
            exp_annotations: {summary: Harbor Mail 公网 TLS 证书链中最早到期的证书距到期不足 21 天}
      - eval_time: 11m
        alertname: HarborPublicCertificateExpiring
