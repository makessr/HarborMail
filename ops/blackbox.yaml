modules:
  harbor_https:
    prober: http
    timeout: 5s
    http:
      follow_redirects: false
      fail_if_not_ssl: true
  harbor_tls:
    prober: tcp
    timeout: 5s
    tcp:
      tls: true
  harbor_smtp_banner:
    prober: tcp
    timeout: 5s
    tcp:
      query_response:
        - expect: '^220 '
  harbor_smtp_starttls:
    prober: tcp
    timeout: 5s
    tcp:
      query_response:
        - expect: '^220 '
        - send: "EHLO monitor.example.invalid\r"
        - expect: '^250[ -]STARTTLS([[:space:]]|$)'
        - send: "STARTTLS\r"
        - expect: '^220 '
        - starttls: true
        - send: "EHLO monitor.example.invalid\r"
        - expect: '^250 '
