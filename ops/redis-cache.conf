bind 0.0.0.0
protected-mode no
port 6379
daemonize no
save ""
appendonly no
maxmemory 64mb
maxmemory-policy allkeys-lru

# The listener is on the dedicated internal Compose network. Only the
# cache keyspace and commands the application and health probe use are allowed.
user default reset on nopass ~harbor-mail:* -@all +hello +ping +get +set +client|setinfo
